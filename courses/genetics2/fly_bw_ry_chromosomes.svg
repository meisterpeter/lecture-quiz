<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" role="img" aria-label="Crossing bw (Chr 2) and ry (Chr 3) homozygous stocks">
<rect width="540" height="250" rx="10" fill="#ffffff"/>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #18242b; }
  .title { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: #526270; }
  .lbl { font-size: 13.5px; font-weight: 700; }
  .gt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; }
  .it { font-style: italic; }
  .mut { fill: #c0392b; font-weight: 700; }
  .wt { fill: #17874f; font-weight: 700; }
  .acc { fill: #0b6e99; font-weight: 700; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#425466"/>
  </marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c0392b"/>
  </marker>
  <marker id="arrOk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#17874f"/>
  </marker>
</defs>

  <text x="270" y="26" text-anchor="middle" class="title">Crossing brown-eyed stocks mutated on different chromosomes</text>

  <!-- Stock 1 -->
  <rect x="18" y="48" width="186" height="182" rx="10" fill="#faf7f4" stroke="#cbb8a5" stroke-width="1.5"/>
  <ellipse cx="48" cy="76" rx="15" ry="11" fill="#6b4423" stroke="#3e2714" stroke-width="1.5"/>
  <text x="72" y="75" class="lbl">Stock 1 (2n)</text>
  <text x="72" y="90" class="sub">mutant in <tspan class="it">bw</tspan> (Chr 2)</text>
  <text x="30" y="122" class="sub">Chr 2:</text>
  <rect x="76" y="106" width="112" height="22" rx="11" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="132" y="122" text-anchor="middle" class="gt" fill="#c0392b">bw / bw</text>
  <text x="30" y="164" class="sub">Chr 3:</text>
  <rect x="76" y="148" width="112" height="22" rx="11" fill="#eaf6ef" stroke="#17874f" stroke-width="1.5"/>
  <text x="132" y="164" text-anchor="middle" class="gt" fill="#17874f">+ / + (WT ry)</text>
  <text x="111" y="206" text-anchor="middle" class="sub">Gamete carries 1 of each</text>

  <text x="223" y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#526270">×</text>

  <!-- Stock 2 -->
  <rect x="242" y="48" width="186" height="182" rx="10" fill="#faf7f4" stroke="#cbb8a5" stroke-width="1.5"/>
  <ellipse cx="272" cy="76" rx="15" ry="11" fill="#6b4423" stroke="#3e2714" stroke-width="1.5"/>
  <text x="296" y="75" class="lbl">Stock 2 (2n)</text>
  <text x="296" y="90" class="sub">mutant in <tspan class="it">ry</tspan> (Chr 3)</text>
  <text x="254" y="122" class="sub">Chr 2:</text>
  <rect x="300" y="106" width="112" height="22" rx="11" fill="#eaf6ef" stroke="#17874f" stroke-width="1.5"/>
  <text x="356" y="122" text-anchor="middle" class="gt" fill="#17874f">+ / + (WT bw)</text>
  <text x="254" y="164" class="sub">Chr 3:</text>
  <rect x="300" y="148" width="112" height="22" rx="11" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="356" y="164" text-anchor="middle" class="gt" fill="#c0392b">ry / ry</text>
  <text x="335" y="206" text-anchor="middle" class="sub">Gamete carries 1 of each</text>

  <line x1="434" y1="138" x2="456" y2="138" stroke="#425466" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="462" y="78" width="64" height="120" rx="10" fill="#eef6fa" stroke="#0b6e99" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="494" y="116" text-anchor="middle" class="lbl" fill="#0b6e99">F1</text>
  <text x="494" y="152" text-anchor="middle" font-size="24" font-weight="800" fill="#0b6e99">?</text>

</svg>