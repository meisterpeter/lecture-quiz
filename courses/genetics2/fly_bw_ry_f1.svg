<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 235" role="img" aria-label="F1 Drosophila genotype bw/+ ; +/ry">
<rect width="540" height="235" rx="10" fill="#ffffff"/>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #18242b; }
  .title { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: #526270; }
  .lbl { font-size: 13.5px; font-weight: 700; }
  .gt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; }
  .it { font-style: italic; }
  .mut { fill: #c0392b; font-weight: 700; }
  .wt { fill: #17874f; font-weight: 700; }
  .acc { fill: #0b6e99; font-weight: 700; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#425466"/>
  </marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c0392b"/>
  </marker>
  <marker id="arrOk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#17874f"/>
  </marker>
</defs>

  <text x="270" y="26" text-anchor="middle" class="title">F1 <tspan class="it">Drosophila</tspan> carrying <tspan class="gt">bw / + ; + / ry</tspan></text>

  <rect x="22" y="46" width="336" height="168" rx="12" fill="#f6f9fb" stroke="#cbd5e1" stroke-width="1.6"/>
  <!-- Chr 2 pair -->
  <text x="98" y="72" text-anchor="middle" class="lbl">Chromosome 2</text>
  <rect x="42" y="84" width="112" height="22" rx="11" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="98" y="100" text-anchor="middle" class="gt" fill="#c0392b">bw</text>
  <rect x="42" y="114" width="112" height="22" rx="11" fill="#eaf6ef" stroke="#17874f" stroke-width="1.5"/>
  <text x="98" y="130" text-anchor="middle" class="gt" fill="#17874f">+ (bw⁺)</text>

  <line x1="186" y1="66" x2="186" y2="148" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="186" y="166" text-anchor="middle" class="gt" fill="#64748b">;</text>

  <!-- Chr 3 pair -->
  <text x="274" y="72" text-anchor="middle" class="lbl">Chromosome 3</text>
  <rect x="218" y="84" width="112" height="22" rx="11" fill="#eaf6ef" stroke="#17874f" stroke-width="1.5"/>
  <text x="274" y="100" text-anchor="middle" class="gt" fill="#17874f">+ (ry⁺)</text>
  <rect x="218" y="114" width="112" height="22" rx="11" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="274" y="130" text-anchor="middle" class="gt" fill="#c0392b">ry</text>

  <text x="190" y="194" text-anchor="middle" class="sub">Both brown-eyed parents were homozygous recessive</text>

  <line x1="366" y1="130" x2="396" y2="130" stroke="#425466" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="402" y="74" width="118" height="112" rx="12" fill="#eef6fa" stroke="#0b6e99" stroke-width="1.8" stroke-dasharray="5 3"/>
  <ellipse cx="461" cy="115" rx="24" ry="17" fill="#ffffff" stroke="#0b6e99" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="461" y="121" text-anchor="middle" font-size="18" font-weight="800" fill="#0b6e99">?</text>
  <text x="461" y="158" text-anchor="middle" class="lbl" fill="#0b6e99">F1 eye colour?</text>

</svg>