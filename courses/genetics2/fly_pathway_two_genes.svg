<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 235" role="img" aria-label="Five brown-eyed fly stocks in a two-gene pigment pathway">
<rect width="540" height="235" rx="10" fill="#ffffff"/>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #18242b; }
  .title { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: #526270; }
  .lbl { font-size: 13.5px; font-weight: 700; }
  .gt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; }
  .it { font-style: italic; }
  .mut { fill: #c0392b; font-weight: 700; }
  .wt { fill: #17874f; font-weight: 700; }
  .acc { fill: #0b6e99; font-weight: 700; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#425466"/>
  </marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c0392b"/>
  </marker>
  <marker id="arrOk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#17874f"/>
  </marker>
</defs>

  <text x="270" y="26" text-anchor="middle" class="title">Five stocks isolated with identical brown eyes (<tspan class="it">Drosophila</tspan>)</text>
  <rect x="20" y="44" width="500" height="84" rx="10" fill="#faf7f4" stroke="#cbb8a5"/>
  <text x="270" y="66" text-anchor="middle" class="sub" font-weight="600">Mutagenesis screen isolates 5 homozygous brown-eyed stocks:</text>
  <g transform="translate(76,96)">
    <ellipse cx="0" cy="0" rx="16" ry="11" fill="#6b4423" stroke="#3e2714"/><text x="0" y="23" text-anchor="middle" font-size="12" font-weight="700">Stock 1</text>
  </g>
  <g transform="translate(173,96)">
    <ellipse cx="0" cy="0" rx="16" ry="11" fill="#6b4423" stroke="#3e2714"/><text x="0" y="23" text-anchor="middle" font-size="12" font-weight="700">Stock 2</text>
  </g>
  <g transform="translate(270,96)">
    <ellipse cx="0" cy="0" rx="16" ry="11" fill="#6b4423" stroke="#3e2714"/><text x="0" y="23" text-anchor="middle" font-size="12" font-weight="700">Stock 3</text>
  </g>
  <g transform="translate(367,96)">
    <ellipse cx="0" cy="0" rx="16" ry="11" fill="#6b4423" stroke="#3e2714"/><text x="0" y="23" text-anchor="middle" font-size="12" font-weight="700">Stock 4</text>
  </g>
  <g transform="translate(464,96)">
    <ellipse cx="0" cy="0" rx="16" ry="11" fill="#6b4423" stroke="#3e2714"/><text x="0" y="23" text-anchor="middle" font-size="12" font-weight="700">Stock 5</text>
  </g>

  <!-- Multi-step pigment synthesis -->
  <rect x="20" y="142" width="500" height="76" rx="10" fill="#f6f9fb" stroke="#d8e1e8"/>
  <text x="80" y="184" text-anchor="middle" font-size="12.5" font-weight="600">Precursor</text>
  <line x1="120" y1="180" x2="188" y2="180" stroke="#425466" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="154" y="170" text-anchor="middle" class="lbl" fill="#0b6e99">Gene I</text>
  <text x="242" y="184" text-anchor="middle" font-size="12.5" font-weight="600">Intermediate</text>
  <line x1="296" y1="180" x2="364" y2="180" stroke="#425466" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="330" y="170" text-anchor="middle" class="lbl" fill="#0b6e99">Gene II</text>
  <ellipse cx="404" cy="180" rx="15" ry="10.5" fill="#cf2a1e" stroke="#7f1d1d"/>
  <text x="468" y="178" text-anchor="middle" font-size="12.5" font-weight="700" fill="#cf2a1e">Wild-type</text>
  <text x="468" y="194" text-anchor="middle" font-size="11.5" fill="#cf2a1e">red eye</text>

</svg>