<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 215" role="img" aria-label="Two recessive mutants give a mutant diploid">
<rect width="520" height="215" rx="10" fill="#ffffff"/>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #18242b; }
  .title { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: #526270; }
  .lbl { font-size: 13.5px; font-weight: 700; }
  .gt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; }
  .it { font-style: italic; }
  .mut { fill: #c0392b; font-weight: 700; }
  .wt { fill: #17874f; font-weight: 700; }
  .acc { fill: #0b6e99; font-weight: 700; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#425466"/>
  </marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c0392b"/>
  </marker>
  <marker id="arrOk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#17874f"/>
  </marker>
</defs>

  <text x="260" y="26" text-anchor="middle" class="title">Outcome of a complementation cross between two recessive mutants</text>

  <rect x="26" y="54" width="132" height="126" rx="10" fill="#fff8f7" stroke="#e2b4af" stroke-width="1.5"/>
  <circle cx="92" cy="96" r="20" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.6"/>
  <text x="92" y="138" text-anchor="middle" class="lbl">Mutant 1</text>
  <text x="92" y="156" text-anchor="middle" class="sub">(recessive)</text>

  <text x="180" y="122" text-anchor="middle" font-size="22" font-weight="700" fill="#526270">×</text>

  <rect x="202" y="54" width="132" height="126" rx="10" fill="#fff8f7" stroke="#e2b4af" stroke-width="1.5"/>
  <circle cx="268" cy="96" r="20" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.6"/>
  <text x="268" y="138" text-anchor="middle" class="lbl">Mutant 2</text>
  <text x="268" y="156" text-anchor="middle" class="sub">(recessive)</text>

  <line x1="342" y1="117" x2="374" y2="117" stroke="#425466" stroke-width="2.2" marker-end="url(#arr)"/>

  <rect x="382" y="54" width="114" height="126" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <circle cx="439" cy="96" r="22" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.8"/>
  <text x="439" y="138" text-anchor="middle" class="mut">Mutant 2n</text>
  <text x="439" y="158" text-anchor="middle" class="sub">Conclusion = ?</text>

</svg>