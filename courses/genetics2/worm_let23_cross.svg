<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" role="img" aria-label="Cross between two let-23 Vul worm mutants">
<rect width="540" height="220" rx="10" fill="#ffffff"/>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #18242b; }
  .title { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: #526270; }
  .lbl { font-size: 13.5px; font-weight: 700; }
  .gt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; }
  .it { font-style: italic; }
  .mut { fill: #c0392b; font-weight: 700; }
  .wt { fill: #17874f; font-weight: 700; }
  .acc { fill: #0b6e99; font-weight: 700; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#425466"/>
  </marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c0392b"/>
  </marker>
  <marker id="arrOk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#17874f"/>
  </marker>
</defs>

  <text x="270" y="25" text-anchor="middle" class="title">Cross A: both Vul strains carry recessive mutations in <tspan class="it">let-23</tspan> (Chr II)</text>

  <rect x="20" y="46" width="186" height="152" rx="10" fill="#fff8f7" stroke="#e2b4af"/>
  <text x="113" y="72" text-anchor="middle" class="lbl">w1 ⚥ mother (Vul)</text>
  <text x="113" y="96" text-anchor="middle" class="sub">Chr II pair:</text>
  <rect x="46" y="106" width="134" height="22" rx="11" fill="#fdecea" stroke="#c0392b"/>
  <text x="113" y="122" text-anchor="middle" class="gt" fill="#c0392b">let-23(a)</text>
  <rect x="46" y="134" width="134" height="22" rx="11" fill="#fdecea" stroke="#c0392b"/>
  <text x="113" y="150" text-anchor="middle" class="gt" fill="#c0392b">let-23(a)</text>

  <text x="223" y="126" text-anchor="middle" font-size="22" font-weight="700" fill="#526270">×</text>

  <rect x="242" y="46" width="186" height="152" rx="10" fill="#fff8f7" stroke="#e2b4af"/>
  <text x="335" y="72" text-anchor="middle" class="lbl">w2 ♂ father (let-23)</text>
  <text x="335" y="96" text-anchor="middle" class="sub">Chr II pair:</text>
  <rect x="268" y="106" width="134" height="22" rx="11" fill="#fdecea" stroke="#c0392b"/>
  <text x="335" y="122" text-anchor="middle" class="gt" fill="#c0392b">let-23(b)</text>
  <rect x="268" y="134" width="134" height="22" rx="11" fill="#fdecea" stroke="#c0392b"/>
  <text x="335" y="150" text-anchor="middle" class="gt" fill="#c0392b">let-23(b)</text>

  <line x1="434" y1="122" x2="456" y2="122" stroke="#425466" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="462" y="66" width="64" height="112" rx="10" fill="#eef6fa" stroke="#0b6e99" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="494" y="106" text-anchor="middle" class="lbl" fill="#0b6e99">F1 ⚥</text>
  <text x="494" y="140" text-anchor="middle" font-size="24" font-weight="800" fill="#0b6e99">?</text>

</svg>