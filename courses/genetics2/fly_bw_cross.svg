<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" role="img" aria-label="Crossing two homozygous bw fly stocks">
<rect width="540" height="240" rx="10" fill="#ffffff"/>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #18242b; }
  .title { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: #526270; }
  .lbl { font-size: 13.5px; font-weight: 700; }
  .gt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; }
  .it { font-style: italic; }
  .mut { fill: #c0392b; font-weight: 700; }
  .wt { fill: #17874f; font-weight: 700; }
  .acc { fill: #0b6e99; font-weight: 700; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#425466"/>
  </marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c0392b"/>
  </marker>
  <marker id="arrOk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#17874f"/>
  </marker>
</defs>

  <text x="270" y="26" text-anchor="middle" class="title"><tspan class="it">Drosophila</tspan> cross: two brown-eyed stocks mutant in <tspan class="it">brown</tspan> (<tspan class="it">bw</tspan>, Chr 2)</text>

  <rect x="20" y="48" width="182" height="168" rx="10" fill="#faf7f4" stroke="#cbb8a5" stroke-width="1.5"/>
  <ellipse cx="52" cy="80" rx="16" ry="11.5" fill="#6b4423" stroke="#3e2714" stroke-width="1.5"/>
  <text x="78" y="78" class="lbl">Stock 1 (2n)</text>
  <text x="78" y="94" class="sub">brown eyes</text>
  <text x="111" y="124" text-anchor="middle" class="sub">Chromosome 2 pair:</text>
  <rect x="52" y="134" width="118" height="18" rx="9" fill="#f3e8de" stroke="#6b4423" stroke-width="1.5"/>
  <text x="111" y="148" text-anchor="middle" class="gt" fill="#6b4423">bw¹</text>
  <rect x="52" y="158" width="118" height="18" rx="9" fill="#f3e8de" stroke="#6b4423" stroke-width="1.5"/>
  <text x="111" y="172" text-anchor="middle" class="gt" fill="#6b4423">bw¹</text>
  <text x="111" y="202" text-anchor="middle" class="sub">Homozygous mutant</text>

  <text x="222" y="134" text-anchor="middle" font-size="22" font-weight="700" fill="#526270">×</text>

  <rect x="242" y="48" width="182" height="168" rx="10" fill="#faf7f4" stroke="#cbb8a5" stroke-width="1.5"/>
  <ellipse cx="274" cy="80" rx="16" ry="11.5" fill="#6b4423" stroke="#3e2714" stroke-width="1.5"/>
  <text x="300" y="78" class="lbl">Stock 2 (2n)</text>
  <text x="300" y="94" class="sub">brown eyes</text>
  <text x="333" y="124" text-anchor="middle" class="sub">Chromosome 2 pair:</text>
  <rect x="274" y="134" width="118" height="18" rx="9" fill="#f3e8de" stroke="#6b4423" stroke-width="1.5"/>
  <text x="333" y="148" text-anchor="middle" class="gt" fill="#6b4423">bw²</text>
  <rect x="274" y="158" width="118" height="18" rx="9" fill="#f3e8de" stroke="#6b4423" stroke-width="1.5"/>
  <text x="333" y="172" text-anchor="middle" class="gt" fill="#6b4423">bw²</text>
  <text x="333" y="202" text-anchor="middle" class="sub">Homozygous mutant</text>

  <line x1="430" y1="132" x2="454" y2="132" stroke="#425466" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="460" y="72" width="66" height="120" rx="10" fill="#eef6fa" stroke="#0b6e99" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="493" y="112" text-anchor="middle" class="lbl" fill="#0b6e99">F1 fly</text>
  <text x="493" y="146" text-anchor="middle" font-size="24" font-weight="800" fill="#0b6e99">?</text>

</svg>