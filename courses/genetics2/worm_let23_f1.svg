<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" role="img" aria-label="Cross-progeny C. elegans hermaphrodite let-23(a)/let-23(b)">
<rect width="540" height="230" rx="10" fill="#ffffff"/>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #18242b; }
  .title { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: #526270; }
  .lbl { font-size: 13.5px; font-weight: 700; }
  .gt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; }
  .it { font-style: italic; }
  .mut { fill: #c0392b; font-weight: 700; }
  .wt { fill: #17874f; font-weight: 700; }
  .acc { fill: #0b6e99; font-weight: 700; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#425466"/>
  </marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c0392b"/>
  </marker>
  <marker id="arrOk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#17874f"/>
  </marker>
</defs>

  <text x="270" y="26" text-anchor="middle" class="title">Cross-progeny <tspan class="it">C. elegans</tspan> ⚥: <tspan class="gt">let-23(a) / let-23(b)</tspan></text>
  <rect x="24" y="48" width="332" height="162" rx="14" fill="#f6f9fb" stroke="#64748b" stroke-width="1.8"/>
  <text x="190" y="72" text-anchor="middle" class="sub" font-weight="600">Chromosome II pair (<tspan class="it">let-23</tspan> EGF-receptor locus)</text>

  <rect x="54" y="88" width="272" height="24" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="74" y1="93" x2="84" y2="107" stroke="#c0392b" stroke-width="2.6"/>
  <line x1="84" y1="93" x2="74" y2="107" stroke="#c0392b" stroke-width="2.6"/>
  <text x="198" y="105" text-anchor="middle" class="gt" fill="#c0392b">let-23(a) (maternal)</text>

  <rect x="54" y="126" width="272" height="24" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="182" y="143" text-anchor="middle" class="gt" fill="#c0392b">let-23(b) (paternal)</text>
  <line x1="296" y1="131" x2="306" y2="145" stroke="#c0392b" stroke-width="2.6"/>
  <line x1="306" y1="131" x2="296" y2="145" stroke="#c0392b" stroke-width="2.6"/>

  <text x="190" y="180" text-anchor="middle" class="sub">Anchor cell secretes normal LIN-3 (EGF);</text>
  <text x="190" y="197" text-anchor="middle" class="sub">other cascade genes (<tspan class="it">let-60, lin-45, mpk-1</tspan>) are wild-type</text>

  <line x1="364" y1="129" x2="394" y2="129" stroke="#425466" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="400" y="72" width="120" height="114" rx="12" fill="#eef6fa" stroke="#0b6e99" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="460" y="114" text-anchor="middle" font-size="24" font-weight="800" fill="#0b6e99">?</text>
  <text x="460" y="148" text-anchor="middle" class="lbl" fill="#0b6e99">Vulva</text>
  <text x="460" y="166" text-anchor="middle" class="sub">phenotype?</text>

</svg>