<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 245" role="img" aria-label="Mating m1 (ade1) and m2 (ade2) haploids">
<rect width="540" height="245" rx="10" fill="#ffffff"/>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #18242b; }
  .title { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: #526270; }
  .lbl { font-size: 13.5px; font-weight: 700; }
  .gt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; }
  .it { font-style: italic; }
  .mut { fill: #c0392b; font-weight: 700; }
  .wt { fill: #17874f; font-weight: 700; }
  .acc { fill: #0b6e99; font-weight: 700; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#425466"/>
  </marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c0392b"/>
  </marker>
  <marker id="arrOk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#17874f"/>
  </marker>
</defs>

  <text x="270" y="26" text-anchor="middle" class="title">Mating two red haploids mutated in different genes</text>
  <!-- m1 box -->
  <rect x="20" y="48" width="184" height="174" rx="10" fill="#fff8f7" stroke="#e2b4af" stroke-width="1.5"/>
  <circle cx="46" cy="74" r="12" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.4"/>
  <text x="66" y="79" class="lbl">Haploid m1 (1n)</text>
  <!-- Chr I (ade1 mutant) -->
  <text x="34" y="112" class="sub">Chr I:</text>
  <rect x="82" y="96" width="106" height="22" rx="11" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="135" y="112" text-anchor="middle" class="gt" fill="#c0392b">ade1 (mutant)</text>
  <!-- Chr XV (ADE2 WT) -->
  <text x="34" y="154" class="sub">Chr XV:</text>
  <rect x="82" y="138" width="106" height="22" rx="11" fill="#eaf6ef" stroke="#17874f" stroke-width="1.5"/>
  <text x="135" y="154" text-anchor="middle" class="gt" fill="#17874f">ADE2 (WT)</text>
  <text x="112" y="198" text-anchor="middle" class="sub">Red, needs adenine</text>

  <text x="223" y="138" text-anchor="middle" font-size="22" font-weight="700" fill="#526270">×</text>

  <!-- m2 box -->
  <rect x="242" y="48" width="184" height="174" rx="10" fill="#fff8f7" stroke="#e2b4af" stroke-width="1.5"/>
  <circle cx="268" cy="74" r="12" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.4"/>
  <text x="288" y="79" class="lbl">Haploid m2 (1n)</text>
  <!-- Chr I (ADE1 WT) -->
  <text x="256" y="112" class="sub">Chr I:</text>
  <rect x="304" y="96" width="106" height="22" rx="11" fill="#eaf6ef" stroke="#17874f" stroke-width="1.5"/>
  <text x="357" y="112" text-anchor="middle" class="gt" fill="#17874f">ADE1 (WT)</text>
  <!-- Chr XV (ade2 mutant) -->
  <text x="256" y="154" class="sub">Chr XV:</text>
  <rect x="304" y="138" width="106" height="22" rx="11" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="357" y="154" text-anchor="middle" class="gt" fill="#c0392b">ade2 (mutant)</text>
  <text x="334" y="198" text-anchor="middle" class="sub">Red, needs adenine</text>

  <line x1="432" y1="135" x2="454" y2="135" stroke="#425466" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="460" y="76" width="66" height="118" rx="10" fill="#eef6fa" stroke="#0b6e99" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="493" y="116" text-anchor="middle" class="lbl" fill="#0b6e99">2n</text>
  <text x="493" y="150" text-anchor="middle" font-size="24" font-weight="800" fill="#0b6e99">?</text>

</svg>