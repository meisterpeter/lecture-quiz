<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 275" role="img" aria-label="Adenine pathway and mating of two ade2 haploid mutants">
<rect width="540" height="275" rx="10" fill="#ffffff"/>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #18242b; }
  .title { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: #526270; }
  .lbl { font-size: 13.5px; font-weight: 700; }
  .gt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; }
  .it { font-style: italic; }
  .mut { fill: #c0392b; font-weight: 700; }
  .wt { fill: #17874f; font-weight: 700; }
  .acc { fill: #0b6e99; font-weight: 700; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#425466"/>
  </marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c0392b"/>
  </marker>
  <marker id="arrOk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#17874f"/>
  </marker>
</defs>

  <text x="270" y="26" text-anchor="middle" class="title">Budding yeast adenine pathway &amp; red haploid cross</text>
  <!-- Pathway box -->
  <rect x="18" y="40" width="504" height="106" rx="10" fill="#f6f9fb" stroke="#d8e1e8"/>
  <rect x="30" y="66" width="84" height="36" rx="8" fill="#ffffff" stroke="#8fa1b3" stroke-width="1.5"/>
  <text x="72" y="89" text-anchor="middle" font-size="12.5" font-weight="600">Precursor</text>
  <line x1="118" y1="84" x2="178" y2="84" stroke="#425466" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="148" y="75" text-anchor="middle" class="lbl" fill="#0b6e99">Ade2</text>
  <rect x="184" y="58" width="118" height="52" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
  <text x="243" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#a9261c">AIR intermediate</text>
  <text x="243" y="98" text-anchor="middle" font-size="11.5" fill="#a9261c">(polymerises → red)</text>
  <line x1="306" y1="84" x2="366" y2="84" stroke="#425466" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="336" y="75" text-anchor="middle" class="lbl" fill="#0b6e99">Ade1</text>
  <rect x="372" y="62" width="136" height="44" rx="8" fill="#eaf6ef" stroke="#17874f" stroke-width="1.6"/>
  <text x="440" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#17874f">AMP / Adenine</text>
  <text x="440" y="97" text-anchor="middle" font-size="11.5" fill="#17874f">(white colony, Ade⁺)</text>
  <text x="270" y="135" text-anchor="middle" class="sub">Loss of Ade2 or Ade1 (CAIR/SAICAR steps) accumulates red pigment &amp; requires adenine</text>

  <!-- Cross setup at bottom -->
  <rect x="34" y="162" width="146" height="92" rx="10" fill="#fff8f7" stroke="#e2b4af" stroke-width="1.5"/>
  <circle cx="64" cy="196" r="15" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="90" y="193" class="lbl">Haploid m1</text>
  <text x="90" y="210" class="sub">1n · red, Ade⁻</text>
  <text x="107" y="240" text-anchor="middle" class="gt" fill="#c0392b">ade2-1</text>

  <text x="206" y="212" text-anchor="middle" font-size="22" font-weight="700" fill="#526270">×</text>

  <rect x="232" y="162" width="146" height="92" rx="10" fill="#fff8f7" stroke="#e2b4af" stroke-width="1.5"/>
  <circle cx="262" cy="196" r="15" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="288" y="193" class="lbl">Haploid m2</text>
  <text x="288" y="210" class="sub">1n · red, Ade⁻</text>
  <text x="305" y="240" text-anchor="middle" class="gt" fill="#c0392b">ade2-2</text>

  <line x1="386" y1="208" x2="418" y2="208" stroke="#425466" stroke-width="2.2" marker-end="url(#arr)"/>

  <rect x="424" y="162" width="96" height="92" rx="10" fill="#eef6fa" stroke="#0b6e99" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="472" y="198" text-anchor="middle" class="lbl" fill="#0b6e99">Diploid (2n)</text>
  <text x="472" y="228" text-anchor="middle" font-size="22" font-weight="800" fill="#0b6e99">?</text>

</svg>