<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" role="img" aria-label="Checking recessiveness before a complementation test">
<rect width="540" height="230" rx="10" fill="#ffffff"/>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #18242b; }
  .title { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: #526270; }
  .lbl { font-size: 13.5px; font-weight: 700; }
  .gt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; }
  .it { font-style: italic; }
  .mut { fill: #c0392b; font-weight: 700; }
  .wt { fill: #17874f; font-weight: 700; }
  .acc { fill: #0b6e99; font-weight: 700; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#425466"/>
  </marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c0392b"/>
  </marker>
  <marker id="arrOk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#17874f"/>
  </marker>
</defs>

  <text x="270" y="25" text-anchor="middle" class="title">Prerequisite check before running a complementation test</text>

  <!-- Step 1: check against WT -->
  <rect x="20" y="46" width="236" height="164" rx="10" fill="#f6f9fb" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="138" y="68" text-anchor="middle" class="lbl" fill="#0b6e99">Step 1: Backcross mutant × WT</text>
  <text x="138" y="102" text-anchor="middle" class="gt">m1 × +  →  m1 / +</text>
  <rect x="44" y="118" width="188" height="36" rx="8" fill="#eaf6ef" stroke="#17874f"/>
  <text x="138" y="141" text-anchor="middle" font-size="12.5" font-weight="700" fill="#17874f">WT phenotype → m1 is recessive</text>
  <rect x="44" y="162" width="188" height="36" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="138" y="185" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b">Mutant → m1 is dominant!</text>

  <!-- Step 2: Complementation cross -->
  <rect x="276" y="46" width="244" height="164" rx="10" fill="#eef6fa" stroke="#0b6e99" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="398" y="68" text-anchor="middle" class="lbl" fill="#0b6e99">Step 2: Cross m1 × m2</text>
  <text x="398" y="96" text-anchor="middle" class="sub">Suppose <tspan class="it">m1</tspan> (Gene A) and <tspan class="it">m2</tspan> (Gene B)</text>
  <text x="398" y="114" text-anchor="middle" class="sub">are in <tspan font-weight="700">two different genes</tspan>:</text>
  <text x="398" y="144" text-anchor="middle" class="gt">m1 +  /  + m2</text>
  <text x="398" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#0b6e99">Why does the test break if</text>
  <text x="398" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#0b6e99"><tspan class="it">m1</tspan> is dominant?</text>

</svg>