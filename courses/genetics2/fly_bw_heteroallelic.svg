<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" role="img" aria-label="Heteroallelic bw1 / bw2 F1 fly">
<rect width="540" height="230" rx="10" fill="#ffffff"/>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #18242b; }
  .title { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: #526270; }
  .lbl { font-size: 13.5px; font-weight: 700; }
  .gt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; }
  .it { font-style: italic; }
  .mut { fill: #c0392b; font-weight: 700; }
  .wt { fill: #17874f; font-weight: 700; }
  .acc { fill: #0b6e99; font-weight: 700; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#425466"/>
  </marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c0392b"/>
  </marker>
  <marker id="arrOk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#17874f"/>
  </marker>
</defs>

  <text x="270" y="26" text-anchor="middle" class="title">F1 <tspan class="it">Drosophila</tspan> genotype: <tspan class="gt">bw¹ / bw²</tspan> (Chromosome 2)</text>

  <rect x="24" y="46" width="330" height="162" rx="12" fill="#f6f9fb" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="189" y="70" text-anchor="middle" class="sub" font-weight="600">Homologous chromosome 2 pair in F1 cells</text>

  <rect x="56" y="84" width="266" height="24" rx="12" fill="#f3e8de" stroke="#6b4423" stroke-width="1.5"/>
  <line x1="78" y1="89" x2="88" y2="103" stroke="#c0392b" stroke-width="2.6"/>
  <line x1="88" y1="89" x2="78" y2="103" stroke="#c0392b" stroke-width="2.6"/>
  <text x="196" y="101" text-anchor="middle" class="gt" fill="#6b4423">bw¹ (from parent 1)</text>

  <rect x="56" y="122" width="266" height="24" rx="12" fill="#f3e8de" stroke="#6b4423" stroke-width="1.5"/>
  <text x="182" y="139" text-anchor="middle" class="gt" fill="#6b4423">bw² (from parent 2)</text>
  <line x1="292" y1="127" x2="302" y2="141" stroke="#c0392b" stroke-width="2.6"/>
  <line x1="302" y1="127" x2="292" y2="141" stroke="#c0392b" stroke-width="2.6"/>

  <text x="189" y="172" text-anchor="middle" class="sub">Wild-type red eye requires both brown ommochromes</text>
  <text x="189" y="190" text-anchor="middle" class="sub">+ bright red drosopterins (need functional <tspan class="it">bw⁺</tspan> &amp; <tspan class="it">ry⁺</tspan>)</text>

  <line x1="362" y1="127" x2="394" y2="127" stroke="#425466" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="400" y="72" width="120" height="110" rx="12" fill="#eef6fa" stroke="#0b6e99" stroke-width="1.8" stroke-dasharray="5 3"/>
  <ellipse cx="460" cy="112" rx="24" ry="17" fill="#ffffff" stroke="#0b6e99" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="460" y="118" text-anchor="middle" font-size="18" font-weight="800" fill="#0b6e99">?</text>
  <text x="460" y="156" text-anchor="middle" class="lbl" fill="#0b6e99">F1 eye colour?</text>

</svg>