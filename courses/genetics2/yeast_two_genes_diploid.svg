<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" role="img" aria-label="Diploid yeast carrying ade1 ADE2 / ADE1 ade2">
<rect width="540" height="240" rx="10" fill="#ffffff"/>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #18242b; }
  .title { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: #526270; }
  .lbl { font-size: 13.5px; font-weight: 700; }
  .gt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; }
  .it { font-style: italic; }
  .mut { fill: #c0392b; font-weight: 700; }
  .wt { fill: #17874f; font-weight: 700; }
  .acc { fill: #0b6e99; font-weight: 700; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#425466"/>
  </marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c0392b"/>
  </marker>
  <marker id="arrOk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#17874f"/>
  </marker>
</defs>

  <text x="270" y="26" text-anchor="middle" class="title">Diploid yeast cell: <tspan class="gt">ade1 ADE2 / ADE1 ade2</tspan></text>
  <rect x="24" y="48" width="336" height="168" rx="14" fill="#f6f9fb" stroke="#64748b" stroke-width="1.8"/>

  <!-- Genome from m1 -->
  <text x="44" y="90" class="sub" font-weight="700">from m1:</text>
  <rect x="114" y="74" width="96" height="22" rx="11" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="162" y="90" text-anchor="middle" class="gt" fill="#c0392b">ade1</text>
  <rect x="224" y="74" width="96" height="22" rx="11" fill="#eaf6ef" stroke="#17874f" stroke-width="1.5"/>
  <text x="272" y="90" text-anchor="middle" class="gt" fill="#17874f">ADE2</text>

  <!-- Genome from m2 -->
  <text x="44" y="134" class="sub" font-weight="700">from m2:</text>
  <rect x="114" y="118" width="96" height="22" rx="11" fill="#eaf6ef" stroke="#17874f" stroke-width="1.5"/>
  <text x="162" y="134" text-anchor="middle" class="gt" fill="#17874f">ADE1</text>
  <rect x="224" y="118" width="96" height="22" rx="11" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="272" y="134" text-anchor="middle" class="gt" fill="#c0392b">ade2</text>

  <text x="162" y="164" text-anchor="middle" class="sub">Chr I pair</text>
  <text x="272" y="164" text-anchor="middle" class="sub">Chr XV pair</text>
  <text x="192" y="196" text-anchor="middle" class="sub">Both parent genomes share one cytoplasm &amp; nucleus</text>

  <line x1="368" y1="134" x2="398" y2="134" stroke="#425466" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="404" y="78" width="118" height="112" rx="12" fill="#eef6fa" stroke="#0b6e99" stroke-width="1.8" stroke-dasharray="5 3"/>
  <circle cx="463" cy="120" r="22" fill="#ffffff" stroke="#0b6e99" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="463" y="127" text-anchor="middle" font-size="20" font-weight="800" fill="#0b6e99">?</text>
  <text x="463" y="162" text-anchor="middle" class="lbl" fill="#0b6e99">Colony colour</text>
  <text x="463" y="178" text-anchor="middle" class="sub">&amp; growth?</text>

</svg>