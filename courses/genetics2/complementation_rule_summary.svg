<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" role="img" aria-label="Summary of same-gene vs different-gene complementation">
<rect width="540" height="230" rx="10" fill="#ffffff"/>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #18242b; }
  .title { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: #526270; }
  .lbl { font-size: 13.5px; font-weight: 700; }
  .gt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; }
  .it { font-style: italic; }
  .mut { fill: #c0392b; font-weight: 700; }
  .wt { fill: #17874f; font-weight: 700; }
  .acc { fill: #0b6e99; font-weight: 700; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#425466"/>
  </marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c0392b"/>
  </marker>
  <marker id="arrOk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#17874f"/>
  </marker>
</defs>

  <text x="270" y="25" text-anchor="middle" class="title">The complementation rule (for recessive loss-of-function alleles)</text>

  <!-- Left: Same gene -->
  <rect x="18" y="44" width="244" height="170" rx="12" fill="#fff8f7" stroke="#c0392b" stroke-width="1.6"/>
  <text x="140" y="68" text-anchor="middle" class="mut">Same gene (alleles)</text>
  <rect x="42" y="84" width="92" height="22" rx="11" fill="#fdecea" stroke="#c0392b"/><text x="88" y="100" text-anchor="middle" class="gt" fill="#c0392b">a¹</text>
  <rect x="146" y="84" width="92" height="22" rx="11" fill="#eaf6ef" stroke="#17874f"/><text x="192" y="100" text-anchor="middle" class="gt" fill="#17874f">B⁺</text>
  <rect x="42" y="114" width="92" height="22" rx="11" fill="#fdecea" stroke="#c0392b"/><text x="88" y="130" text-anchor="middle" class="gt" fill="#c0392b">a²</text>
  <rect x="146" y="114" width="92" height="22" rx="11" fill="#eaf6ef" stroke="#17874f"/><text x="192" y="130" text-anchor="middle" class="gt" fill="#17874f">B⁺</text>
  <text x="140" y="164" text-anchor="middle" font-size="12.5">No functional Gene A product</text>
  <text x="140" y="192" text-anchor="middle" font-size="12.5" fill="#c0392b" font-weight="700">Mutant 2n → Fails to complement</text>

  <!-- Right: Different genes -->
  <rect x="278" y="44" width="244" height="170" rx="12" fill="#f2fbf6" stroke="#17874f" stroke-width="1.6"/>
  <text x="400" y="68" text-anchor="middle" class="wt">Two different genes</text>
  <rect x="302" y="84" width="92" height="22" rx="11" fill="#fdecea" stroke="#c0392b"/><text x="348" y="100" text-anchor="middle" class="gt" fill="#c0392b">a¹</text>
  <rect x="406" y="84" width="92" height="22" rx="11" fill="#eaf6ef" stroke="#17874f"/><text x="452" y="100" text-anchor="middle" class="gt" fill="#17874f">B⁺</text>
  <rect x="302" y="114" width="92" height="22" rx="11" fill="#eaf6ef" stroke="#17874f"/><text x="348" y="130" text-anchor="middle" class="gt" fill="#17874f">A⁺</text>
  <rect x="406" y="114" width="92" height="22" rx="11" fill="#fdecea" stroke="#c0392b"/><text x="452" y="130" text-anchor="middle" class="gt" fill="#c0392b">b¹</text>
  <text x="400" y="164" text-anchor="middle" font-size="12.5">Both A⁺ and B⁺ supplied in trans</text>
  <text x="400" y="192" text-anchor="middle" font-size="12.5" fill="#17874f" font-weight="700">Wild-type 2n → Complements</text>

</svg>