<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 235" role="img" aria-label="Diploid yeast carrying ade2-1 and ade2-2">
<rect width="540" height="235" rx="10" fill="#ffffff"/>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #18242b; }
  .title { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: #526270; }
  .lbl { font-size: 13.5px; font-weight: 700; }
  .gt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; }
  .it { font-style: italic; }
  .mut { fill: #c0392b; font-weight: 700; }
  .wt { fill: #17874f; font-weight: 700; }
  .acc { fill: #0b6e99; font-weight: 700; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#425466"/>
  </marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c0392b"/>
  </marker>
  <marker id="arrOk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#17874f"/>
  </marker>
</defs>

  <text x="270" y="26" text-anchor="middle" class="title">Diploid yeast cell: <tspan class="gt">ade2-1 / ade2-2</tspan></text>
  <rect x="24" y="48" width="320" height="164" rx="14" fill="#f6f9fb" stroke="#64748b" stroke-width="1.8"/>
  <text x="184" y="72" text-anchor="middle" class="sub" font-weight="600">Homologous chromosome XV pair (<tspan class="it">ADE2</tspan> locus)</text>

  <!-- Homolog 1 from m1 -->
  <rect x="66" y="92" width="238" height="24" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <rect x="134" y="92" width="112" height="24" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="196" y="109" text-anchor="middle" class="gt" fill="#c0392b">ade2-1</text>
  <line x1="145" y1="96" x2="155" y2="112" stroke="#c0392b" stroke-width="2.6"/>
  <line x1="155" y1="96" x2="145" y2="112" stroke="#c0392b" stroke-width="2.6"/>
  <text x="88" y="108" font-size="11.5" fill="#475569">m1</text>

  <!-- Homolog 2 from m2 -->
  <rect x="66" y="138" width="238" height="24" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <rect x="134" y="138" width="112" height="24" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="178" y="155" text-anchor="middle" class="gt" fill="#c0392b">ade2-2</text>
  <line x1="226" y1="142" x2="236" y2="158" stroke="#c0392b" stroke-width="2.6"/>
  <line x1="236" y1="142" x2="226" y2="158" stroke="#c0392b" stroke-width="2.6"/>
  <text x="88" y="154" font-size="11.5" fill="#475569">m2</text>

  <text x="185" y="190" text-anchor="middle" class="sub">(Both copies of <tspan class="it">ADE1</tspan> are wild-type)</text>

  <line x1="348" y1="132" x2="386" y2="132" stroke="#425466" stroke-width="2.2" marker-end="url(#arr)"/>
  <!-- Unknown colony -->
  <rect x="394" y="76" width="126" height="112" rx="12" fill="#eef6fa" stroke="#0b6e99" stroke-width="1.8" stroke-dasharray="5 3"/>
  <circle cx="457" cy="118" r="22" fill="#ffffff" stroke="#0b6e99" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="457" y="125" text-anchor="middle" font-size="20" font-weight="800" fill="#0b6e99">?</text>
  <text x="457" y="160" text-anchor="middle" class="lbl" fill="#0b6e99">Colony colour</text>
  <text x="457" y="176" text-anchor="middle" class="sub">&amp; adenine need?</text>

</svg>