<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 235" role="img" aria-label="C. elegans LIN-3 / LET-23 / LET-60 / LIN-45 vulval signaling cascade">
<rect width="540" height="235" rx="10" fill="#ffffff"/>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #18242b; }
  .title { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: #526270; }
  .lbl { font-size: 13.5px; font-weight: 700; }
  .gt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; }
  .it { font-style: italic; }
  .mut { fill: #c0392b; font-weight: 700; }
  .wt { fill: #17874f; font-weight: 700; }
  .acc { fill: #0b6e99; font-weight: 700; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#425466"/>
  </marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c0392b"/>
  </marker>
  <marker id="arrOk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#17874f"/>
  </marker>
</defs>

  <text x="270" y="25" text-anchor="middle" class="title"><tspan class="it">C. elegans</tspan> vulval induction signaling chain</text>

  <!-- Anchor cell -->
  <ellipse cx="74" cy="96" rx="50" ry="30" fill="#fde68a" stroke="#b45309" stroke-width="1.8"/>
  <text x="74" y="93" text-anchor="middle" font-size="12.5" font-weight="700">Anchor cell</text>
  <text x="74" y="109" text-anchor="middle" font-size="11.5" fill="#92400e">gonad</text>

  <!-- LIN-3 signal -->
  <line x1="126" y1="96" x2="184" y2="96" stroke="#b45309" stroke-width="2.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="155" y="84" text-anchor="middle" class="lbl" fill="#b45309">LIN-3</text>
  <text x="155" y="114" text-anchor="middle" font-size="11" fill="#92400e">(EGF, Chr IV)</text>

  <!-- VPC box -->
  <rect x="190" y="46" width="332" height="142" rx="14" fill="#f6f9fb" stroke="#64748b" stroke-width="1.8"/>
  <text x="356" y="66" text-anchor="middle" class="sub" font-weight="700">Vulval Precursor Cell (P5.p / P6.p / P7.p)</text>

  <!-- Receptor LET-23 on membrane -->
  <rect x="182" y="78" width="66" height="38" rx="8" fill="#dbeafe" stroke="#0b6e99" stroke-width="1.8"/>
  <text x="215" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#0b6e99">LET-23</text>
  <text x="215" y="109" text-anchor="middle" font-size="10.5" fill="#0b6e99">EGFR · II</text>

  <line x1="250" y1="97" x2="276" y2="97" stroke="#425466" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="280" y="78" width="66" height="38" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="313" y="95" text-anchor="middle" font-size="12" font-weight="700">LET-60</text>
  <text x="313" y="109" text-anchor="middle" font-size="10.5" fill="#526270">Ras · IV</text>

  <line x1="348" y1="97" x2="374" y2="97" stroke="#425466" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="378" y="78" width="66" height="38" rx="8" fill="#dbeafe" stroke="#0b6e99" stroke-width="1.8"/>
  <text x="411" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#0b6e99">LIN-45</text>
  <text x="411" y="109" text-anchor="middle" font-size="10.5" fill="#0b6e99">Raf · IV</text>

  <line x1="411" y1="118" x2="411" y2="138" stroke="#425466" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="240" y="142" width="256" height="32" rx="8" fill="#eaf6ef" stroke="#17874f" stroke-width="1.6"/>
  <text x="368" y="163" text-anchor="middle" font-size="12" font-weight="700" fill="#17874f">MEK-2 (I) → MPK-1 (III) → Vulva forms</text>

  <text x="270" y="214" text-anchor="middle" class="sub">Recessive loss of any link blocks vulval induction → <tspan class="mut">Vulvaless (Vul, bag of worms)</tspan></text>

</svg>