<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" role="img" aria-label="Intragenic complementation between two alleles of one gene">
<rect width="540" height="230" rx="10" fill="#ffffff"/>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #18242b; }
  .title { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: #526270; }
  .lbl { font-size: 13.5px; font-weight: 700; }
  .gt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; }
  .it { font-style: italic; }
  .mut { fill: #c0392b; font-weight: 700; }
  .wt { fill: #17874f; font-weight: 700; }
  .acc { fill: #0b6e99; font-weight: 700; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#425466"/>
  </marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c0392b"/>
  </marker>
  <marker id="arrOk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#17874f"/>
  </marker>
</defs>

  <text x="270" y="25" text-anchor="middle" class="title">Intragenic complementation: two alleles of ONE gene</text>

  <!-- Single gene locus map -->
  <rect x="30" y="44" width="480" height="68" rx="10" fill="#f6f9fb" stroke="#cbd5e1"/>
  <text x="270" y="63" text-anchor="middle" class="sub" font-weight="600">Single gene <tspan class="it">GENE X</tspan> (two distinct recessive mutations mapped inside the same ORF)</text>
  <line x1="60" y1="88" x2="480" y2="88" stroke="#64748b" stroke-width="3"/>
  <rect x="110" y="74" width="320" height="28" rx="6" fill="#dbeafe" stroke="#0b6e99" stroke-width="1.8"/>
  <!-- allele 1 star -->
  <line x1="168" y1="70" x2="178" y2="106" stroke="#c0392b" stroke-width="2.8"/>
  <line x1="178" y1="70" x2="168" y2="106" stroke="#c0392b" stroke-width="2.8"/>
  <text x="173" y="67" text-anchor="middle" font-size="11.5" class="mut">allele x-1</text>
  <!-- allele 2 star -->
  <line x1="362" y1="70" x2="372" y2="106" stroke="#d55e00" stroke-width="2.8"/>
  <line x1="372" y1="70" x2="362" y2="106" stroke="#d55e00" stroke-width="2.8"/>
  <text x="367" y="67" text-anchor="middle" font-size="11.5" fill="#d55e00" font-weight="700">allele x-2</text>

  <!-- Three diploids -->
  <rect x="30" y="128" width="146" height="84" rx="10" fill="#fdecea" stroke="#c0392b"/>
  <text x="103" y="156" text-anchor="middle" class="gt">x-1 / x-1</text>
  <text x="103" y="186" text-anchor="middle" class="mut">Mutant</text>

  <rect x="197" y="128" width="146" height="84" rx="10" fill="#fdecea" stroke="#c0392b"/>
  <text x="270" y="156" text-anchor="middle" class="gt">x-2 / x-2</text>
  <text x="270" y="186" text-anchor="middle" class="mut">Mutant</text>

  <rect x="364" y="128" width="146" height="84" rx="10" fill="#eaf6ef" stroke="#17874f" stroke-width="2"/>
  <text x="437" y="156" text-anchor="middle" class="gt">x-1 / x-2</text>
  <text x="437" y="184" text-anchor="middle" class="wt">Partly wild-type!</text>
  <text x="437" y="202" text-anchor="middle" class="sub">Mechanism = ?</text>

</svg>